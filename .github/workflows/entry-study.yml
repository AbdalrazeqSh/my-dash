name: entry-study
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node bot/scalp/entry.js
      - run: |
          git config user.name "forward-logger"; git config user.email "forward-logger@users.noreply.github.com"
          git add data/entry-study.md
          git diff --cached --quiet && exit 0
          git commit -m "entry study results"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
