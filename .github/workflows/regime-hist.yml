name: regime-hist
on:
  workflow_dispatch:
    inputs:
      days: { description: 'history days', default: '1095' }
permissions: { contents: write }
jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: DAYS=${{ github.event.inputs.days }} node bot/smc/regime.js
      - run: |
          git config user.name "forward-logger"; git config user.email "forward-logger@users.noreply.github.com"
          git add data/regime-hist.md data/smc-regime.json
          git diff --cached --quiet && exit 0
          git commit -m "regime: historical test"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
